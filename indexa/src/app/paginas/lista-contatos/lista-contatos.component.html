<app-container>
    <app-cabecalho></app-cabecalho>
    <input
    type="search"
    placeholder="Digite para buscar"
    [(ngModel)]="filtroPorTexto"
    />
    <section class="adicionar-contato">
      <button class="" routerLink="/formulario">
        <img src="../../../assets/icones/icon (2).png" alt="">
        <span>adicionar contato</span>
      </button>
    </section>
    @for (letra of alfabeto; track letra) {
        <app-separador>
          {{ letra }}
        </app-separador>
        @for (contato of filtrarContatoPorLetra(letra); track contato.id) {
          <app-contato [nome]="contato.nome" [telefone]="contato.telefone"></app-contato>
        }
      }
</app-container>
